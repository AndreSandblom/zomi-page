<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="dayWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#daySky)"/>
  <!-- Distant archipelago islands -->
  <path d="M0 380 Q 300 370 600 375 T 1200 370 L 1200 450 L 0 450 Z" fill="#475569" opacity="0.5"/>
  <!-- Water -->
  <rect y="400" width="1200" height="275" fill="url(#dayWater)"/>
  <!-- Red Archipelago House -->
  <polygon points="500,280 700,280 700,420 500,420" fill="#991b1b"/>
  <polygon points="480,280 600,190 720,280" fill="#1e293b"/>
  <!-- Windows (Dark unlit in day) -->
  <rect x="530" y="310" width="40" height="50" fill="#334155" stroke="#ffffff" stroke-width="3"/>
  <rect x="630" y="310" width="40" height="50" fill="#334155" stroke="#ffffff" stroke-width="3"/>
  <!-- Jetty / Dock -->
  <polygon points="520,420 680,420 740,560 460,560" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <!-- Badge -->
  <rect x="40" y="40" width="190" height="42" rx="21" fill="rgba(15, 23, 42, 0.8)"/>
  <text x="55" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">FÖRE: GRÅMULEN DAG</text>
</svg>
