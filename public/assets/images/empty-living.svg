<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="emptyWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="parquetFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#bc6c25"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <!-- Empty Room Walls -->
  <polygon points="0,0 1200,0 1000,420 200,420" fill="url(#emptyWall)"/>
  <!-- Left Wall -->
  <polygon points="0,0 200,420 0,675" fill="#cbd5e1"/>
  <!-- Right Wall with Large Window -->
  <polygon points="1200,0 1000,420 1200,675" fill="#cbd5e1"/>
  <!-- Hardwood Floor -->
  <polygon points="0,675 200,420 1000,420 1200,675" fill="url(#parquetFloor)"/>
  <!-- Floor perspective planks -->
  <line x1="200" y1="420" x2="0" y2="675" stroke="#9a3412" stroke-width="1.5" opacity="0.3"/>
  <line x1="360" y1="420" x2="240" y2="675" stroke="#9a3412" stroke-width="1.5" opacity="0.3"/>
  <line x1="520" y1="420" x2="480" y2="675" stroke="#9a3412" stroke-width="1.5" opacity="0.3"/>
  <line x1="680" y1="420" x2="720" y2="675" stroke="#9a3412" stroke-width="1.5" opacity="0.3"/>
  <line x1="840" y1="420" x2="960" y2="675" stroke="#9a3412" stroke-width="1.5" opacity="0.3"/>
  <!-- Large Window on Back Wall -->
  <rect x="360" y="80" width="480" height="280" fill="url(#windowLight)" stroke="#94a3b8" stroke-width="8"/>
  <line x1="600" y1="80" x2="600" y2="360" stroke="#94a3b8" stroke-width="6"/>
  <line x1="360" y1="220" x2="840" y2="220" stroke="#94a3b8" stroke-width="4"/>
  <!-- Sunlight patch on floor -->
  <polygon points="420,420 780,420 860,620 340,620" fill="#ffffff" opacity="0.25"/>
  <!-- Badge -->
  <rect x="40" y="40" width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.8)"/>
  <text x="55" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">FÖRE: TOMT RUM</text>
</svg>
