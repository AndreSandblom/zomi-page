<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="warmWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="parquetFloorStaged" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#bc6c25"/>
    </linearGradient>
    <linearGradient id="sofaFabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cushionGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Room Walls -->
  <polygon points="0,0 1200,0 1000,420 200,420" fill="url(#warmWall)"/>
  <polygon points="0,0 200,420 0,675" fill="#e2e8f0"/>
  <polygon points="1200,0 1000,420 1200,675" fill="#e2e8f0"/>
  <!-- Floor -->
  <polygon points="0,675 200,420 1000,420 1200,675" fill="url(#parquetFloorStaged)"/>
  
  <!-- Window with sheer linen curtains -->
  <rect x="360" y="80" width="480" height="280" fill="#bae6fd" stroke="#475569" stroke-width="6"/>
  <line x1="600" y1="80" x2="600" y2="360" stroke="#475569" stroke-width="4"/>
  <!-- Curtains -->
  <path d="M330 60 Q 370 200 350 380 L 320 380 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M870 60 Q 830 200 850 380 L 880 380 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Designer Wall Art -->
  <rect x="150" y="140" width="120" height="160" fill="#0f172a" stroke="#d4af37" stroke-width="4"/>
  <circle cx="210" cy="220" r="35" fill="#f59e0b"/>
  <path d="M170 260 Q 210 180 250 260 Z" fill="#e2e8f0"/>

  <!-- Designer Wool Rug -->
  <polygon points="300,560 900,560 980,660 220,660" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M320 570 L 880 570 M 280 610 L 920 610 M 240 650 L 960 650" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Modern Scandinavian Sectional Sofa -->
  <!-- Backrest -->
  <rect x="340" y="410" width="520" height="90" rx="16" fill="url(#sofaFabric)"/>
  <!-- Seat Cushions -->
  <rect x="330" y="470" width="540" height="70" rx="14" fill="#475569"/>
  <!-- Decorative Cushions -->
  <rect x="360" y="430" width="55" height="55" rx="8" fill="url(#cushionGold)"/>
  <rect x="430" y="435" width="50" height="50" rx="8" fill="#ffffff"/>
  <rect x="790" y="430" width="55" height="55" rx="8" fill="url(#cushionGold)"/>
  <rect x="730" y="435" width="50" height="50" rx="8" fill="#0284c7"/>

  <!-- Oak Coffee Table -->
  <ellipse cx="600" cy="570" rx="140" ry="35" fill="#b45309"/>
  <ellipse cx="600" cy="565" rx="140" ry="35" fill="#d97706"/>
  <!-- Coffee Table Books & Minimalist Ceramic Vase -->
  <rect x="540" y="550" width="45" height="12" rx="2" fill="#ffffff"/>
  <rect x="545" y="542" width="38" height="8" rx="2" fill="#0f172a"/>
  <!-- Ceramic Vase with Eucalyptus branch -->
  <path d="M640 560 C 630 550, 630 530, 640 520 C 650 530, 650 550, 640 560 Z" fill="#ffffff"/>
  <path d="M640 520 Q 645 490 635 460" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <circle cx="635" cy="480" r="5" fill="#4ade80"/>
  <circle cx="642" cy="465" r="6" fill="#4ade80"/>

  <!-- Floor Lamp & Indoor Fiddle Leaf Fig Plant -->
  <!-- Lamp on left -->
  <ellipse cx="180" cy="490" rx="25" ry="8" fill="#0f172a"/>
  <path d="M180 490 Q 230 250 290 280" stroke="#0f172a" stroke-width="5" fill="none"/>
  <ellipse cx="290" cy="285" rx="20" ry="12" fill="#d4af37"/>
  <ellipse cx="290" cy="287" rx="16" ry="8" fill="#fef08a" opacity="0.8"/>

  <!-- Indoor Plant on right -->
  <path d="M960 480 L 1000 480 L 990 540 L 970 540 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="980" cy="430" rx="35" ry="45" fill="#15803d"/>
  <ellipse cx="960" cy="410" rx="30" ry="35" fill="#22c55e"/>
  <ellipse cx="1005" cy="420" rx="28" ry="40" fill="#16a34a"/>

  <!-- Badge -->
  <rect x="40" y="40" width="230" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(229,179,100,0.4)" stroke-width="1.5"/>
  <circle cx="62" cy="61" r="6" fill="#e5b364"/>
  <text x="80" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#fef08a">EFTER: AI-HOMESTAGING</text>
</svg>
