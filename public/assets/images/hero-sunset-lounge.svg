<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sunset Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="35%" stop-color="#2a1f3d"/>
      <stop offset="65%" stop-color="#5a2e38"/>
      <stop offset="85%" stop-color="#b4532a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Lake Water Gradient -->
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="30%" stop-color="#451a03"/>
      <stop offset="70%" stop-color="#18121e"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>

    <!-- Fireplace Glow Gradient -->
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Ambient Interior Glow -->
    <radialGradient id="roomWarmth" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0"/>
    </radialGradient>

    <!-- Horizontal Left Fade (Pure Dark on Left to reveal image on Right) -->
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090a0d" stop-opacity="1"/>
      <stop offset="32%" stop-color="#090a0d" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#090a0d" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#090a0d" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#090a0d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Vignette -->
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d" stop-opacity="0"/>
      <stop offset="70%" stop-color="#090a0d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background Sky outside panoramic windows -->
  <rect width="1920" height="1080" fill="#090a0d"/>

  <!-- Right-side Outdoor Sunset View (Visible through windows) -->
  <g id="outdoor-sunset">
    <!-- Sky -->
    <rect x="700" y="0" width="1220" height="580" fill="url(#skyGrad)"/>

    <!-- Distant Mountains -->
    <path d="M700 420 Q 880 340 1050 380 T 1380 320 T 1650 360 T 1920 330 L 1920 580 L 700 580 Z" fill="#2d1c2e" opacity="0.9"/>
    <path d="M800 440 Q 980 380 1150 410 T 1500 370 T 1800 400 T 1920 380 L 1920 580 L 800 580 Z" fill="#1b1220"/>

    <!-- Lake Water with Sunset Golden Reflection -->
    <rect x="700" y="440" width="1220" height="240" fill="url(#lakeGrad)"/>
    
    <!-- Water shimmer trails -->
    <ellipse cx="1450" cy="465" rx="300" ry="8" fill="#fef08a" opacity="0.6"/>
    <ellipse cx="1400" cy="485" rx="240" ry="10" fill="#f59e0b" opacity="0.5"/>
    <ellipse cx="1360" cy="510" rx="180" ry="12" fill="#d97706" opacity="0.4"/>
    <ellipse cx="1320" cy="540" rx="120" ry="14" fill="#b45309" opacity="0.3"/>
  </g>

  <!-- Luxury Penthouse Architecture & Interior -->
  <g id="interior-architecture">
    <!-- Ceiling / Top Wall -->
    <polygon points="0,0 1920,0 1920,120 700,90 0,110" fill="#0d0f14"/>

    <!-- Floor-to-Ceiling Panoramic Window Mullions / Metal Frames -->
    <line x1="1080" y1="90" x2="1080" y2="680" stroke="#12151c" stroke-width="8"/>
    <line x1="1480" y1="90" x2="1480" y2="680" stroke="#12151c" stroke-width="8"/>
    <line x1="1880" y1="90" x2="1880" y2="680" stroke="#12151c" stroke-width="10"/>
    <line x1="700" y1="680" x2="1920" y2="680" stroke="#12151c" stroke-width="8"/>

    <!-- Glass reflections on windows -->
    <polygon points="1090,100 1250,95 1190,670 1090,670" fill="#ffffff" opacity="0.04"/>
    <polygon points="1490,100 1620,95 1560,670 1490,670" fill="#ffffff" opacity="0.03"/>

    <!-- Deep Charcoal / Marble Floor -->
    <polygon points="0,1080 1920,1080 1920,680 700,680 0,680" fill="#0a0c10"/>

    <!-- Low Modern Designer Lounge Sofas -->
    <!-- Center/Right Sofa Base & Cushions -->
    <path d="M920 620 L 1420 620 L 1400 780 L 880 780 Z" fill="#141822"/>
    <rect x="940" y="560" width="460" height="90" rx="16" fill="#191e2b"/>
    <rect x="910" y="630" width="490" height="85" rx="14" fill="#1b212f"/>
    <!-- Pillows & Throw Plaid -->
    <rect x="940" y="590" width="65" height="55" rx="8" fill="#283042"/>
    <rect x="1010" y="595" width="55" height="50" rx="8" fill="#323b50"/>
    <rect x="1320" y="590" width="65" height="55" rx="8" fill="#283042"/>

    <!-- Chaise Longue in Foreground Right -->
    <polygon points="1100,750 1620,720 1680,950 1020,980" fill="#121620"/>
    <polygon points="1120,740 1600,710 1650,880 1060,910" fill="#171c28"/>

    <!-- Low Designer Coffee Table with Accents -->
    <polygon points="1200,680 1560,670 1520,750 1140,760" fill="#0d1017" stroke="#222836" stroke-width="2"/>
    <!-- Books & Candle Glow on table -->
    <rect x="1280" y="690" width="60" height="12" rx="2" fill="#e2e8f0" opacity="0.8"/>
    <rect x="1290" y="682" width="50" height="8" rx="2" fill="#1e293b"/>
    <circle cx="1420" cy="700" r="4" fill="#fef08a"/>
    <circle cx="1420" cy="700" r="16" fill="#f59e0b" opacity="0.4"/>

    <!-- Ultra-Modern Glass Fireplace Wall on Right Side -->
    <rect x="1560" y="320" width="360" height="420" fill="#0e1118" stroke="#1f2533" stroke-width="4"/>
    <!-- Fireplace Bench / Hearthstone -->
    <rect x="1520" y="620" width="400" height="120" rx="8" fill="#e2e8f0" opacity="0.85"/>
    <polygon points="1520,620 1920,620 1920,640 1520,640" fill="#cbd5e1"/>

    <!-- Fireplace Glass Chamber -->
    <rect x="1580" y="360" width="300" height="260" fill="#090a0d" stroke="#334155" stroke-width="3"/>
    
    <!-- Warm Fire Glow Chamber Halo -->
    <circle cx="1730" cy="520" r="180" fill="url(#fireGlow)" opacity="0.85"/>

    <!-- Realistic Stylized Fireplace Flames -->
    <g id="flames">
      <path d="M1640 580 Q 1660 500 1680 540 Q 1700 460 1720 520 Q 1740 440 1760 510 Q 1780 470 1800 550 Q 1820 510 1840 580 Z" fill="#f97316"/>
      <path d="M1660 580 Q 1680 510 1700 535 Q 1720 480 1740 520 Q 1760 460 1780 530 Q 1800 510 1820 580 Z" fill="#facc15"/>
      <path d="M1680 580 Q 1700 530 1720 545 Q 1740 500 1760 540 Q 1780 510 1800 580 Z" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Warm Fire Light Reflection on Floors & Furniture -->
    <ellipse cx="1650" cy="740" rx="180" ry="40" fill="#f59e0b" opacity="0.25"/>
    <ellipse cx="1450" cy="800" rx="220" ry="50" fill="#ea580c" opacity="0.15"/>
  </g>

  <!-- Ambient Light Spreads -->
  <rect width="1920" height="1080" fill="url(#roomWarmth)"/>

  <!-- Left-to-Right Soft Gradient Mask to ensure typography on the left is crystal clear -->
  <rect width="1920" height="1080" fill="url(#leftFade)"/>

  <!-- Bottom Smooth Fade -->
  <rect width="1920" height="1080" fill="url(#bottomFade)"/>
</svg>
