<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#4c1d95"/>
      <stop offset="70%" stop-color="#be185d"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="twilightWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>
  <!-- Twilight Sky -->
  <rect width="1200" height="675" fill="url(#twilightSky)"/>
  <!-- Sunset Glow over horizon -->
  <ellipse cx="600" cy="400" rx="400" ry="80" fill="#f59e0b" opacity="0.4"/>
  <!-- Distant archipelago islands silhouette -->
  <path d="M0 380 Q 300 370 600 375 T 1200 370 L 1200 450 L 0 450 Z" fill="#0f172a" opacity="0.9"/>
  <!-- Mirror Water with Sunset Reflection -->
  <rect y="400" width="1200" height="275" fill="url(#twilightWater)"/>
  <!-- Golden reflection trail on water -->
  <polygon points="560,400 640,400 700,675 500,675" fill="#f59e0b" opacity="0.25"/>
  <!-- Red Archipelago House with Warm Lighting -->
  <polygon points="500,280 700,280 700,420 500,420" fill="#7f1d1d"/>
  <polygon points="480,280 600,190 720,280" fill="#090d16"/>
  <!-- Windows with Warm Cozy Golden Interior Glow -->
  <rect x="530" y="310" width="40" height="50" fill="url(#windowGlow)" stroke="#ffffff" stroke-width="3"/>
  <rect x="630" y="310" width="40" height="50" fill="url(#windowGlow)" stroke="#ffffff" stroke-width="3"/>
  <!-- Glow halos around windows -->
  <circle cx="550" cy="335" r="45" fill="#fef08a" opacity="0.2"/>
  <circle cx="650" cy="335" r="45" fill="#fef08a" opacity="0.2"/>
  <!-- Jetty / Dock with warm deck lanterns -->
  <polygon points="520,420 680,420 740,560 460,560" fill="#292524" stroke="#1c1917" stroke-width="2"/>
  <!-- Deck lanterns -->
  <circle cx="500" cy="490" r="5" fill="#fef08a"/>
  <circle cx="500" cy="490" r="15" fill="#f59e0b" opacity="0.35"/>
  <circle cx="700" cy="490" r="5" fill="#fef08a"/>
  <circle cx="700" cy="490" r="15" fill="#f59e0b" opacity="0.35"/>
  <!-- Badge -->
  <rect x="40" y="40" width="220" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
  <circle cx="62" cy="61" r="6" fill="#f59e0b"/>
  <text x="80" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#fef08a">EFTER: GOLDEN HOUR</text>
</svg>
