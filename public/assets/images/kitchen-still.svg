<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="kitchenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="marbleIsland" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="675" height="1200" fill="url(#kitchenBg)"/>
  <!-- Kitchen Backsplash & Cabinets -->
  <rect x="50" y="200" width="575" height="400" fill="#334155" rx="8"/>
  <rect x="70" y="220" width="535" height="180" fill="#475569" rx="4"/>
  <rect x="70" y="420" width="535" height="160" fill="#1e293b" rx="4"/>
  <!-- Marble Kitchen Island in Foreground -->
  <polygon points="100,700 575,700 625,1000 50,1000" fill="url(#marbleIsland)"/>
  <!-- Brass Pendant Light -->
  <line x1="337" y1="0" x2="337" y2="380" stroke="#d4af37" stroke-width="4"/>
  <ellipse cx="337" cy="380" rx="60" ry="25" fill="#d4af37"/>
  <circle cx="337" cy="400" r="16" fill="#fef08a"/>
  <!-- Badge -->
  <rect x="30" y="40" width="220" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="50" y="66" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">9:16 STILLBILD (FOTO)</text>
</svg>
