<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="kitchenVideoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="marbleIslandGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="675" height="1200" fill="url(#kitchenVideoBg)"/>
  <!-- Panning / Zoomed perspective -->
  <rect x="20" y="150" width="635" height="440" fill="#1e293b" rx="8"/>
  <rect x="40" y="170" width="595" height="200" fill="#334155" rx="4"/>
  <polygon points="50,650 625,650 670,1050 0,1050" fill="url(#marbleIslandGlow)"/>
  <!-- Brass light glowing -->
  <line x1="337" y1="0" x2="337" y2="340" stroke="#d4af37" stroke-width="4"/>
  <ellipse cx="337" cy="340" rx="70" ry="30" fill="#d4af37"/>
  <circle cx="337" cy="360" r="30" fill="#fef08a" opacity="0.6"/>
  
  <!-- Reels UI Elements (Like, Comment, Share icons on right) -->
  <circle cx="620" cy="700" r="22" fill="rgba(15,23,42,0.7)"/>
  <path d="M620 690 C 610 680, 595 695, 620 715 C 645 695, 630 680, 620 690 Z" fill="#ef4444"/>
  
  <circle cx="620" cy="760" r="22" fill="rgba(15,23,42,0.7)"/>
  <circle cx="620" cy="820" r="22" fill="rgba(15,23,42,0.7)"/>

  <!-- Play icon & Badge -->
  <circle cx="337" cy="600" r="45" fill="rgba(9,10,13,0.8)" stroke="#e5b364" stroke-width="3"/>
  <polygon points="328,582 356,600 328,618" fill="#e5b364"/>

  <!-- Badge -->
  <rect x="30" y="40" width="240" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(229,179,100,0.4)" stroke-width="1.5"/>
  <circle cx="50" cy="61" r="6" fill="#e5b364"/>
  <text x="70" y="66" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e5b364">9:16 REELS / TIKTOK VIDEO</text>
